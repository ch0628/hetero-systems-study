name: GPU Analysis and Notion Sync

on:
  push:
    branches:
      - gpu-benchmark
    paths:
      - "results/gpu/**/*.txt"
      - "benchmark/results/validation/**/*.json"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpu-analysis-branch
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GPU branch
        uses: actions/checkout@v6
        with:
          ref: gpu-benchmark
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check GPU analyzer
        run: |
          python -m py_compile benchmark/analyze_results.py
          python -m py_compile automation/sync_notion.py

      - name: Run GPU analyzer self-check
        run: |
          python benchmark/analyze_results.py --self-check

      - name: Analyze GPU results
        run: |
          python benchmark/analyze_results.py

      - name: Commit GPU report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add benchmark/results/gpu_summary.csv
          git add docs/gpu_benchmark_report.md

          if git diff --cached --quiet; then
            echo "GPU 보고서 변경 없음"
          else
            git commit -m "docs: update GPU benchmark analysis"
            git push origin HEAD:gpu-benchmark
          fi

      - name: Sync GPU report to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_GPU_PAGE_ID: ${{ secrets.NOTION_GPU_PAGE_ID }}
        run: |
          python automation/sync_notion.py \
            --target gpu \
            --report docs/gpu_benchmark_report.md