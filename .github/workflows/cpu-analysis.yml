name: CPU Analysis and Notion Sync

on:
  push:
    branches:
      - main
    paths:
      - "benchmark/results/pytorch/**/*.json"
      - "benchmark/results/onnx/**/*.json"
      - "benchmark/results/validation/**/*.json"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpu-analysis-main
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check CPU analyzer
        run: |
          python -m py_compile benchmark/analyze_cpu_results.py
          python -m py_compile automation/sync_notion.py

      - name: Analyze CPU results
        run: |
          python benchmark/analyze_cpu_results.py

      - name: Commit CPU report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add benchmark/results/cpu_summary.csv
          git add docs/cpu_benchmark_report.md

          if git diff --cached --quiet; then
            echo "CPU 보고서 변경 없음"
          else
            git commit -m "docs: update CPU benchmark analysis"
            git push origin HEAD:main
          fi

      - name: Sync CPU report to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CPU_PAGE_ID: ${{ secrets.NOTION_CPU_PAGE_ID }}
        run: |
          python automation/sync_notion.py \
            --target cpu \
            --report docs/cpu_benchmark_report.md